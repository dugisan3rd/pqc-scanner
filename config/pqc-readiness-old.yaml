    pattern-regex: '(?i)\bRSA\b.{0,40}\b(1024|1536)\b|\brsa\s*(1024|1536)\b|\bkeysize\s*[:=]\s*(1024|1536)\b|RSA_generate_key_ex\s*\([^,]+,\s*(1024|1536)\b'
