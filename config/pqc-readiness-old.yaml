rules:
  # ============================================================
  # PQC READINESS + WEAK CRYPTO (STATIC FILE SCAN) — DEDUPED
  #
  # Goal:
  # - Tier A: High-confidence PQC usage (libraries/APIs/providers)
  # - Tier B: Crypto posture inventory (TLS/SSH/VPN + crypto APIs + common libs)
  # - Tier C: Weak crypto (broken/deprecated TODAY)
  # - Tier D: Migration inventory (classical public-key = not PQC-resistant)
  # - Tier E: Broad crypto keyword net (triage)
  #
  # Notes:
  # - Semgrep scans files (static). It cannot prove runtime negotiation or OS state.
  # - "generic" rules may match docs/comments; treat as triage unless confirmed.
  # ============================================================

  # ============================================================
  # Tier A — High-confidence PQC usage (libraries/APIs/providers)
  # ============================================================

  - id: pqc.liboqs.c
    languages: [c, cpp]
    message: "PQC: liboqs API usage detected. Record KEM/SIG algorithms and key management."
    severity: INFO
    patterns:
      - pattern-either:
          - pattern: OQS_KEM_new(...)
          - pattern: OQS_KEM_encaps(...)
          - pattern: OQS_KEM_decaps(...)
          - pattern: OQS_SIG_new(...)
          - pattern: OQS_SIG_sign(...)
          - pattern: OQS_SIG_verify(...)
          - pattern: OQS_KEM_alg_is_enabled(...)
          - pattern: OQS_SIG_alg_is_enabled(...)
          - pattern: "#include <oqs/oqs.h>"
    metadata:
      category: pqc
      tier: A
      confidence: high
      ref: "https://github.com/open-quantum-safe/liboqs"

  - id: pqc.oqsprovider.openssl.c
    languages: [c, cpp]
    message: "PQC: OpenSSL oqsprovider detected (provider loading). Verify enabled groups/sigs and interoperability."
    severity: INFO
    patterns:
      - pattern-either:
          - pattern: OSSL_PROVIDER_load(..., "oqsprovider")
          - pattern: OSSL_PROVIDER_load(..., 'oqsprovider')
          - pattern: OSSL_PROVIDER_load($LIBCTX, "oqsprovider")
          - pattern: OSSL_PROVIDER_load($LIBCTX, 'oqsprovider')
    metadata:
      category: pqc
      tier: A
      confidence: high
      ref: "https://github.com/open-quantum-safe/oqs-provider"

  - id: pqc.openssl.cnf.oqsprovider
    languages: [generic]
    message: "PQC: OpenSSL config references oqsprovider/providers. Confirm activation and allowed groups."
    severity: INFO
    pattern-regex: '(?im)^\s*\[providers\]\s*$|^\s*\[oqsprovider\]\s*$|\boqsprovider\b|^\s*activate\s*=\s*1\s*$|^\s*providers\s*=\s*providers\s*$'
    metadata:
      category: pqc
      tier: A
      confidence: medium

  - id: pqc.bouncycastle.java
    languages: [java]
    message: "PQC: BouncyCastle PQC usage/import detected."
    severity: INFO
    patterns:
      - pattern-either:
          - pattern-regex: 'import\s+org\.bouncycastle\.pqc\..*;'
          - pattern-regex: 'org\.bouncycastle\.pqc\..*'
          - pattern-regex: 'BouncyCastlePQCProvider'
    metadata:
      category: pqc
      tier: A
      confidence: medium

  - id: pqc.go.circl
    languages: [go]
    message: "PQC: Cloudflare CIRCL usage/import detected (Kyber/Dilithium/etc.). Confirm production vs experiment."
    severity: INFO
    pattern-regex: '(?i)\bgithub\.com/cloudflare/circl\b|\bcircl/(kem|sign)\b'
    metadata:
      category: pqc
      tier: A
      confidence: medium

  - id: pqc.rust.pqc.crates
    languages: [generic]
    message: "PQC: Rust crate indicators detected (Cargo.toml / code). Confirm actual usage and selected algorithms."
    severity: INFO
    pattern-regex: '(?i)\b(pqcrypto|pqcrypto-kyber|pqcrypto-dilithium|kyber-pke|dilithium|sphincs|falcon|mceliece|hqc|bike)\b'
    metadata:
      category: pqc
      tier: A
      confidence: low

  - id: pqc.algorithms.keyword.any
    languages: [generic]
    message: "PQC: PQC algorithm keyword detected. Verify it’s actual code/config use (not just docs)."
    severity: INFO
    pattern-regex: '(?i)\b(kyber|ml-?kem|dilithium|ml-?dsa|falcon|sphincs\+?|spx|classic\s*mceliece|mceliece|hqc|bike|frodo(kem)?|ntru|sntrup|rainbow)\b'
    metadata:
      category: pqc
      tier: A
      confidence: low

  # ============================================================
  # Tier B — Crypto posture inventory (webapps + configs + common libs)
  # ============================================================

  - id: inv.crypto.libs.any
    languages: [generic]
    message: "Inventory: crypto library keyword detected (OpenSSL/BoringSSL/libsodium/mbedTLS/wolfSSL/Botan/Crypto++/NaCl/WebCrypto)."
    severity: INFO
    pattern-regex: '(?i)\b(openssl|boringssl|libressl|libsodium|sodium|mbedtls|wolfssl|botan|crypto\+\+|cryptopp|nacl|tweetnacl|webcrypto)\b'
    metadata:
      category: inventory
      tier: B
      confidence: low

  # ---------- RSA / ECC / DH APIs (inventory, migration-relevant) ----------

  - id: inv.rsa.api.multilang
    languages: [python, java, go, javascript, typescript, c, cpp, csharp, php, ruby]
    message: "Inventory: RSA usage detected. Track purpose (TLS, signing, encryption), padding, and key sizes."
    severity: INFO
    pattern-either:
      - pattern-regex: '(?i)\bRSA\.generate\('
      - pattern-regex: '(?i)\brsa\.generate_private_key\('
      - pattern-regex: '(?i)\bKeyPairGenerator\.getInstance\("RSA"\)'
      - pattern-regex: '(?i)\bSignature\.getInstance\(".*RSA.*"\)'
      - pattern-regex: '(?i)\bCipher\.getInstance\(".*RSA.*"\)'
      - pattern-regex: '(?i)\bcrypto/rsa\b|\brsa\.GenerateKey\('
      - pattern-regex: '(?i)\bcrypto\.generateKeyPair\(\s*["'']rsa["'']'
      - pattern-regex: '(?i)\bEVP_PKEY_RSA\b|\bNID_rsaEncryption\b|\bRSA_generate_key_ex\b'
    metadata:
      category: inventory
      tier: B
      confidence: medium

  - id: inv.ecc.api.multilang
    languages: [python, java, go, javascript, typescript, c, cpp, csharp]
    message: "Inventory: ECC usage detected (ECDSA/ECDH/Ed25519/X25519). Track curves/groups used."
    severity: INFO
    pattern-either:
      - pattern-regex: '(?i)\bECDSA\b|\bECDH\b|\bsecp256r1\b|\bprime256v1\b|\bsecp384r1\b|\bX25519\b|\bEd25519\b'
      - pattern-regex: '(?i)\bKeyAgreement\.getInstance\("ECDH"\)'
      - pattern-regex: '(?i)\bSignature\.getInstance\(".*ECDSA.*"\)'
      - pattern-regex: '(?i)\bcrypto/ecdh\b|\bcrypto/elliptic\b'
      - pattern-regex: '(?i)\bEVP_PKEY_EC\b|\bEVP_PKEY_X25519\b|\bEVP_PKEY_ED25519\b'
    metadata:
      category: inventory
      tier: B
      confidence: medium

  - id: inv.dh.dsa.legacy.multilang
    languages: [python, java, go, javascript, typescript, c, cpp]
    message: "Inventory/Legacy: DH/DSA detected. Often remediation needed; also impacts migration planning."
    severity: WARNING
    pattern-either:
      - pattern-regex: '(?i)\bDSA\b|\bDiffieHellman\b|\bKeyAgreement\.getInstance\("DH"\)'
      - pattern-regex: '(?i)\bKeyPairGenerator\.getInstance\("DSA"\)'
      - pattern-regex: '(?i)\bcrypto/dsa\b|\bcrypto/dh\b'
      - pattern-regex: '(?i)\bDH_generate_key\b|\bDSA_generate_parameters_ex\b|\bNID_dsa\b'
    metadata:
      category: inventory
      tier: B
      confidence: medium

  # ---------- WebCrypto + Node/Python/PHP/Ruby/JCA/Go/.NET library usage ----------

  - id: inv.webcrypto.subtle
    languages: [javascript, typescript]
    message: "Inventory: WebCrypto usage detected (crypto.subtle). Track algorithms used."
    severity: INFO
    pattern-either:
      - pattern-regex: '(?i)\bcrypto\.subtle\b'
      - pattern-regex: '(?i)\bwindow\.crypto\.subtle\b'
    metadata:
      category: inventory
      tier: B
      confidence: medium

  - id: inv.node.crypto.module
    languages: [javascript, typescript]
    message: "Inventory: Node.js crypto module usage detected."
    severity: INFO
    pattern-either:
      - pattern-regex: '(?i)\brequire\(["'']crypto["'']\)'
      - pattern-regex: '(?i)\bfrom\s+["'']crypto["'']'
      - pattern-regex: '(?i)\bimport\s+\*\s+as\s+crypto\s+from\s+["'']crypto["'']'
      - pattern-regex: '(?i)\bimport\s+crypto\s+from\s+["'']crypto["'']'
    metadata:
      category: inventory
      tier: B
      confidence: medium

  - id: inv.python.crypto.libs
    languages: [python]
    message: "Inventory: Python crypto library usage detected (cryptography/PyCryptodome/pyOpenSSL)."
    severity: INFO
    pattern-regex: '(?i)\b(cryptography\.hazmat|Crypto\.Cipher|Crypto\.PublicKey|OpenSSL\.crypto)\b'
    metadata:
      category: inventory
      tier: B
      confidence: medium

  - id: inv.php.openssl
    languages: [php]
    message: "Inventory: PHP OpenSSL API usage detected."
    severity: INFO
    pattern-regex: '(?i)\bopenssl_(encrypt|decrypt|sign|verify|public_encrypt|private_decrypt|seal|open|get_publickey|get_privatekey)\b'
    metadata:
      category: inventory
      tier: B
      confidence: medium

  - id: inv.ruby.openssl
    languages: [ruby]
    message: "Inventory: Ruby OpenSSL usage detected."
    severity: INFO
    pattern-regex: '(?i)\bOpenSSL::(PKey|Cipher|Digest|X509|SSL)\b'
    metadata:
      category: inventory
      tier: B
      confidence: medium

  - id: inv.java.jca
    languages: [java]
    message: "Inventory: Java crypto APIs detected (JCA/JCE)."
    severity: INFO
    pattern-regex: '(?i)\b(javax\.crypto|java\.security|KeyPairGenerator|MessageDigest|Signature|Cipher|KeyAgreement)\b'
    metadata:
      category: inventory
      tier: B
      confidence: low

  - id: inv.go.crypto.pkgs
    languages: [go]
    message: "Inventory: Go crypto packages detected."
    severity: INFO
    pattern-regex: '(?i)\bcrypto/(tls|x509|rsa|ecdsa|ed25519|elliptic|ecdh|sha256|sha512|hmac)\b'
    metadata:
      category: inventory
      tier: B
      confidence: low

  - id: inv.dotnet.crypto
    languages: [csharp]
    message: "Inventory: .NET crypto usage detected."
    severity: INFO
    pattern-regex: '(?i)\bSystem\.Security\.Cryptography\b|\bSslStream\b|\bX509Certificate2\b'
    metadata:
      category: inventory
      tier: B
      confidence: low

  # ---------- TLS / webserver / proxy / app config surfaces ----------

  - id: inv.tls.config.any
    languages: [generic]
    message: "Inventory: TLS config knobs detected (cipher suites/groups/protocols). Review for posture and PQC/hybrid readiness."
    severity: INFO
    pattern-regex: '(?i)\b(ssl_protocols|ssl_ciphers|SSLCipherSuite|SSLProtocol|ssl-default-bind-ciphers|ssl-default-server-ciphers|ciphersuites|CipherString|MinProtocol|MaxProtocol|Groups|ssl_ecdh_curve|jdk\.tls\.namedGroups)\b'
    metadata:
      category: inventory
      tier: B
      confidence: low

  - id: inv.tls.webserver.proxy.config
    languages: [generic]
    message: "Inventory: Web server/proxy TLS settings detected (nginx/apache/haproxy/envoy/traefik/caddy)."
    severity: INFO
    pattern-regex: '(?i)\b(ssl_protocols|ssl_ciphers|ssl_ecdh_curve|ssl_prefer_server_ciphers|SSLCipherSuite|SSLProtocol|SSLHonorCipherOrder|ssl-default-bind-ciphers|ssl-default-server-ciphers|bind\s+.*ssl|tls_(minimum|maximum)_protocol_version|cipher_suites|ecdh_curves|alpn_protocols|transport_socket|downstream_tls_context|minVersion|maxVersion|ciphers|ecdhCurve)\b'
    metadata:
      category: inventory
      tier: B
      confidence: low

  - id: inv.tls.hybrid.pqc.groups.any
    languages: [generic]
    message: "PQC/Hybrid signal: TLS groups/curves reference suggests hybrid/PQC experimentation. Validate stack support."
    severity: INFO
    pattern-regex: '(?i)\b(ssl_ecdh_curve|Groups|namedGroups|jdk\.tls\.namedGroups)\b.*\b(kyber|mlkem|p256_kyber|x25519_kyber|hybrid)\b|\b(kyber|mlkem)\b.*\b(group|namedgroup|curve)\b'
    metadata:
      category: pqc
      tier: B
      confidence: low

  - id: inv.node.tls.options
    languages: [javascript, typescript]
    message: "Inventory: Node.js TLS options detected (minVersion/maxVersion/ciphers/ecdhCurve)."
    severity: INFO
    pattern-either:
      - pattern-regex: '(?i)\b(minVersion|maxVersion|secureProtocol|ciphers|ecdhCurve|honorCipherOrder)\b'
      - pattern-regex: '(?i)\bhttps\.createServer\('
      - pattern-regex: '(?i)\btls\.createServer\('
    metadata:
      category: inventory
      tier: B
      confidence: low

  - id: inv.java.sslcontext
    languages: [java]
    message: "Inventory: SSLContext usage detected. Ensure TLS 1.2/1.3 posture and avoid hardcoding weak protocols."
    severity: INFO
    pattern-either:
      - pattern-regex: '(?i)\bSSLContext\.getInstance\("TLS"\)'
      - pattern-regex: '(?i)\bSSLContext\.getInstance\("TLSv1"\)'
      - pattern-regex: '(?i)\bSSLContext\.getInstance\("TLSv1\.1"\)'
      - pattern-regex: '(?i)\bSSLContext\.getInstance\("TLSv1\.2"\)'
      - pattern-regex: '(?i)\bSSLContext\.getInstance\("TLSv1\.3"\)'
    metadata:
      category: inventory
      tier: B
      confidence: medium

  - id: inv.java.security.properties
    languages: [generic]
    message: "Inventory: Java security properties detected. Review provider order, disabledAlgorithms, namedGroups."
    severity: INFO
    pattern-regex: '(?i)\b(jdk\.tls\.disabledAlgorithms|jdk\.certpath\.disabledAlgorithms|security\.provider\.\d+|crypto\.policy|jdk\.tls\.namedGroups)\b'
    metadata:
      category: inventory
      tier: B
      confidence: medium

  - id: inv.dotnet.crypto.api
    languages: [csharp]
    message: "Inventory: .NET crypto API usage detected (System.Security.Cryptography). Track algorithms and key sizes; plan PQC migration."
    severity: INFO
    pattern-either:
      - pattern: RSA.Create(...)
      - pattern: ECDsa.Create(...)
      - pattern: ECDiffieHellman.Create(...)
      - pattern: Aes.Create(...)
      - pattern: HMACSHA256(...)
      - pattern: HMACSHA1(...)
      - pattern: MD5.Create(...)
      - pattern: SHA1.Create(...)
      - pattern-regex: '(?i)\bSystem\.Security\.Cryptography\b'
    metadata:
      category: inventory
      tier: B
      confidence: medium

  - id: inv.dotnet.sslstream
    languages: [csharp]
    message: "Inventory: .NET TLS usage detected (SslStream/HttpClientHandler)."
    severity: INFO
    pattern-either:
      - pattern-regex: '(?i)\bSslStream\b'
      - pattern-regex: '(?i)\bHttpClientHandler\b'
      - pattern-regex: '(?i)\bSslProtocols\b'
      - pattern-regex: '(?i)\bServerCertificateCustomValidationCallback\b'
    metadata:
      category: inventory
      tier: B
      confidence: low

  # ---------- SSH / VPN / K8s / IaC ----------

  - id: inv.ssh.config.algorithms
    languages: [generic]
    message: "Inventory: SSH algorithm controls detected. Review KexAlgorithms/HostKeyAlgorithms/Ciphers/MACs."
    severity: INFO
    pattern-regex: '(?im)^\s*(KexAlgorithms|HostKeyAlgorithms|PubkeyAcceptedAlgorithms|CASignatureAlgorithms|Ciphers|MACs)\s+'
    metadata:
      category: inventory
      tier: B
      confidence: medium

  - id: pqc.ssh.kex.keyword
    languages: [generic]
    message: "PQC/Hybrid signal: SSH KEX keyword detected (kyber/mlkem/sntrup/ntru/hybrid). Confirm actual OpenSSH build/support."
    severity: INFO
    pattern-regex: '(?i)\bKexAlgorithms\b.*\b(kyber|mlkem|sntrup|ntru|hybrid)\b|\b(kyber|mlkem|sntrup|ntru)\b.*\b(kex|KexAlgorithms)\b'
    metadata:
      category: pqc
      tier: B
      confidence: low

  - id: inv.ipsec.ike.algorithms
    languages: [generic]
    message: "Inventory: IPsec/IKE config detected. Review DH groups, PRFs, encryption/hashing choices."
    severity: INFO
    pattern-regex: '(?i)\b(ike=|esp=|phase1alg=|phase2alg=|dhgroup|modp\d+|ecp\d+|curve25519|aesgcm|sha2|sha1)\b'
    metadata:
      category: inventory
      tier: B
      confidence: low

  - id: inv.openvpn.crypto
    languages: [generic]
    message: "Inventory: OpenVPN crypto directives detected. Review tls-cipher/data-ciphers and cert settings."
    severity: INFO
    pattern-regex: '(?i)\b(tls-cipher|data-ciphers|cipher\s+AES|cipher\s+BF|auth\s+SHA|tls-crypt|tls-auth)\b'
    metadata:
      category: inventory
      tier: B
      confidence: low

  - id: inv.k8s.ingress.tls.annotations
    languages: [generic]
    message: "Inventory: Kubernetes Ingress/annotations TLS policy knobs detected."
    severity: INFO
    pattern-regex: '(?i)\b(nginx\.ingress\.kubernetes\.io/ssl-protocols|nginx\.ingress\.kubernetes\.io/ssl-ciphers|nginx\.ingress\.kubernetes\.io/force-ssl-redirect|alb\.ingress\.kubernetes\.io/ssl-policy|kubernetes\.io/ingress\.class)\b'
    metadata:
      category: inventory
      tier: B
      confidence: low

  - id: inv.terraform.tls.policy
    languages: [generic]
    message: "Inventory: Terraform/IaC TLS policy references detected (ELB/ALB/CloudFront/Azure/GCP)."
    severity: INFO
    pattern-regex: '(?i)\b(ssl_policy|min_protocol_version|viewer_certificate|cloudfront_default_certificate|tls_policy|https_only|security_policy|sslProfile)\b'
    metadata:
      category: inventory
      tier: B
      confidence: low

  # ============================================================
  # Tier C — Weak crypto (broken/deprecated TODAY)
  # ============================================================

  - id: weak.hash.md5.generic
    languages: [generic]
    message: "Weak crypto: MD5 detected (broken). Replace with SHA-256+ (or Argon2/bcrypt/scrypt for passwords)."
    severity: ERROR
    pattern-regex: '(?i)\bmd5\b|md5withrsa|hmacmd5'
    metadata:
      category: weak-crypto
      tier: C
      type: hash
      confidence: low

  - id: weak.hash.sha1.generic
    languages: [generic]
    message: "Weak crypto: SHA-1 detected (deprecated). Replace with SHA-256+."
    severity: ERROR
    pattern-regex: '(?i)\bsha-?1\b|sha1withrsa|hmacsha1'
    metadata:
      category: weak-crypto
      tier: C
      type: hash
      confidence: low

  - id: weak.python.hashlib.md5sha1
    languages: [python]
    message: "Weak crypto: Python hashlib.md5()/sha1() detected."
    severity: ERROR
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
    metadata:
      category: weak-crypto
      tier: C
      type: hash
      confidence: high

  - id: weak.java.messagedigest.md5sha1
    languages: [java]
    message: "Weak crypto: Java MessageDigest MD5/SHA-1 detected."
    severity: ERROR
    pattern-either:
      - pattern: MessageDigest.getInstance("MD5")
      - pattern: MessageDigest.getInstance("SHA-1")
    metadata:
      category: weak-crypto
      tier: C
      type: hash
      confidence: high

  - id: weak.node.createhash.md5sha1
    languages: [javascript, typescript]
    message: "Weak crypto: Node crypto.createHash('md5'/'sha1') detected."
    severity: ERROR
    pattern-either:
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")
      - pattern: crypto.createHash('md5')
      - pattern: crypto.createHash('sha1')
    metadata:
      category: weak-crypto
      tier: C
      type: hash
      confidence: high

  - id: weak.go.import.md5sha1
    languages: [go]
    message: "Weak crypto: Go import crypto/md5 or crypto/sha1 detected."
    severity: ERROR
    pattern-either:
      - pattern-regex: 'import\s+"crypto/md5"'
      - pattern-regex: 'import\s+"crypto/sha1"'
      - pattern-regex: 'import\s+\(\s*("crypto/md5"|"crypto/sha1")'
    metadata:
      category: weak-crypto
      tier: C
      type: hash
      confidence: medium

  - id: weak.cipher.des3desrc4.generic
    languages: [generic]
    message: "Weak crypto: DES/3DES/RC4 detected (deprecated). Prefer AES-GCM or ChaCha20-Poly1305."
    severity: ERROR
    pattern-regex: '(?i)\bdes\b|\b3des\b|\bdes-ede3\b|\brc4\b|\barcfour\b'
    metadata:
      category: weak-crypto
      tier: C
      type: cipher
      confidence: low

  - id: weak.cipher.blowfish.idea.generic
    languages: [generic]
    message: "Legacy crypto: Blowfish/IDEA detected. Prefer modern AEAD (AES-GCM/ChaCha20-Poly1305)."
    severity: WARNING
    pattern-regex: '(?i)\bblowfish\b|\bidea\b'
    metadata:
      category: weak-crypto
      tier: C
      type: cipher
      confidence: low

  - id: weak.mode.ecb.generic
    languages: [generic]
    message: "Weak crypto: ECB mode detected (unsafe). Use AEAD (AES-GCM/ChaCha20-Poly1305)."
    severity: ERROR
    pattern-regex: '(?i)\bECB\b|\bAES[-_ ]?ECB\b|\bDES[-_ ]?ECB\b'
    metadata:
      category: weak-crypto
      tier: C
      type: mode
      confidence: low

  - id: weak.java.cipher.weakmodes
    languages: [java]
    message: "Weak crypto: Java Cipher uses DES/3DES/RC4/ECB. Prefer AES/GCM/NoPadding or ChaCha20-Poly1305."
    severity: ERROR
    pattern-regex: '(?i)\bCipher\.getInstance\(".*(DES|DESede|3DES|RC4|ECB).*"\)'
    metadata:
      category: weak-crypto
      tier: C
      type: cipher
      confidence: medium

  - id: weak.python.ecb.mode
    languages: [python]
    message: "Weak crypto: Python ECB mode indicator detected (MODE_ECB)."
    severity: ERROR
    pattern-regex: '(?i)\bMODE_ECB\b'
    metadata:
      category: weak-crypto
      tier: C
      type: mode
      confidence: medium

  - id: weak.tls.v1.v1_1.generic
    languages: [generic]
    message: "Weak crypto: TLS 1.0/1.1 detected. Disable; require TLS 1.2/1.3."
    severity: ERROR
    pattern-regex: '(?i)\bTLSv1(\.0)?\b|\bTLSv1\.1\b|\bssl_protocols\s+.*TLSv1(\.0)?\b|\bMinProtocol\s*=\s*TLSv1(\.0)?\b'
    metadata:
      category: weak-crypto
      tier: C
      type: tls
      confidence: medium

  - id: weak.tls.weakcipher.keywords
    languages: [generic]
    message: "Weak TLS cipher hint: NULL/EXPORT/RC4/3DES/MD5/SHA1/anon suites. Confirm in actual cipher lists."
    severity: ERROR
    pattern-regex: '(?i)\b(NULL|aNULL|eNULL|EXPORT|RC4|3DES|DES|MD5|SHA1|anon)\b'
    metadata:
      category: weak-crypto
      tier: C
      type: tls
      confidence: low

  - id: weak.openssl.seclevel.low
    languages: [generic]
    message: "Weak config: OpenSSL security level lowered (SECLEVEL=0/1). Often enables weak suites."
    severity: WARNING
    pattern-regex: '(?i)\b@SECLEVEL=[01]\b|\bseclevel\s*=\s*[01]\b'
    metadata:
      category: weak-crypto
      tier: C
      type: openssl-config
      confidence: medium

  - id: weak.tls.go.insecureskipverify
    languages: [go]
    message: "Critical: Go TLS InsecureSkipVerify=true disables certificate verification."
    severity: ERROR
    pattern: |
      tls.Config{..., InsecureSkipVerify: true, ...}
    metadata:
      category: weak-crypto
      tier: C
      type: tls
      confidence: high

  - id: weak.tls.python.verifyfalse
    languages: [python]
    message: "Critical: Python TLS verification disabled (verify=False / CERT_NONE)."
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: requests.get(..., verify=False, ...)
          - pattern: requests.post(..., verify=False, ...)
          - pattern: urllib3.PoolManager(..., cert_reqs="CERT_NONE", ...)
    metadata:
      category: weak-crypto
      tier: C
      type: tls
      confidence: high

  - id: weak.dotnet.certvalidationcallback
    languages: [csharp]
    message: "Critical: .NET custom cert validation callback present. Ensure it does not accept all certificates."
    severity: WARNING
    pattern-regex: '(?i)\bServerCertificateCustomValidationCallback\b|\bRemoteCertificateValidationCallback\b'
    metadata:
      category: weak-crypto
      tier: C
      type: tls
      confidence: medium

  - id: weak.rsa.shortkey.generic
