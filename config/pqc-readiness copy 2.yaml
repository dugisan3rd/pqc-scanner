# ==============================================================================
# PQC / CBOM Semgrep Ruleset v3 (PHP + JS/TS)
# Adds high-ROI patterns:
#  - libsodium inventory (PHP)
#  - hardcoded PEM / cert blocks (PHP + JS/TS)
#  - RSA weak key sizes (PHP + Node)
#  - JWT verify misuse / alg constraints (Node)
#  - AES-CBC (non-AEAD) inventory/warn (PHP + Node)
#  - WebCrypto inventory (TS/JS frontend)
#  - "Not encryption" patterns (base64/rot13/xor-ish) warn
# 
# ==============================================================================


rules:
  # =============================================================================
  # PHP — Weak Hash / MAC
  # =============================================================================

  - id: pqc-php-weak-hash-direct
    patterns:
      - pattern-either:
          - pattern: md5(...)
          - pattern: sha1(...)
    message: "PQC CBOM Finding (Crypto-Agility=No): Weak hash (MD5/SHA1) detected via direct function call."
    languages: [php]
    severity: ERROR
    metadata:
      vulnerability: "Weak Hash (MD5/SHA1)"
      pqc_risk: "High"
      crypto_agility: "No"
      algorithm_name: "MD5/SHA1"
      algorithm_type: "Hashing"
      cryptographic_function: "Hashing"
      library: "PHP Core"
      purpose: "Hashing"
      recommended_mitigation: "Use SHA-256/SHA-512 (or stronger). Do not use MD5/SHA1 for security decisions."

  - id: pqc-php-weak-hash-hash-api
    patterns:
      - pattern-either:
          - pattern: hash("md5", ...)
          - pattern: hash('md5', ...)
          - pattern: hash("sha1", ...)
          - pattern: hash('sha1', ...)
          - pattern: hash_hmac("md5", ...)
          - pattern: hash_hmac('md5', ...)
          - pattern: hash_hmac("sha1", ...)
          - pattern: hash_hmac('sha1', ...)
    message: "PQC CBOM Finding (Crypto-Agility=No): Weak algorithm selected via hash/hash_hmac (MD5/SHA1)."
    languages: [php]
    severity: ERROR
    metadata:
      vulnerability: "Weak Hash/MAC Selection (hash/hash_hmac)"
      pqc_risk: "High"
      crypto_agility: "No"
      algorithm_name: "MD5/SHA1"
      algorithm_type: "Hashing / MAC"
      cryptographic_function: "Hashing / Message Authentication"
      library: "PHP Core"
      purpose: "Hashing/MAC"
      recommended_mitigation: "Use HMAC-SHA-256 or HMAC-SHA-512; avoid MD5/SHA1."

  - id: pqc-php-weak-pbkdf2-sha1
    patterns:
      - pattern-either:
          - pattern: hash_pbkdf2("sha1", ...)
          - pattern: hash_pbkdf2('sha1', ...)
          - pattern: openssl_pbkdf2(..., ..., ..., ..., "sha1")
          - pattern: openssl_pbkdf2(..., ..., ..., ..., 'sha1')
    message: "PQC CBOM Finding (Crypto-Agility=No): PBKDF2 configured with SHA1 detected."
    languages: [php]
    severity: ERROR
    metadata:
      vulnerability: "Weak KDF Configuration (PBKDF2-SHA1)"
      pqc_risk: "High"
      crypto_agility: "No"
      algorithm_name: "PBKDF2-SHA1"
      algorithm_type: "KDF"
      cryptographic_function: "Key Derivation"
      library: "PHP Core / OpenSSL"
      purpose: "Password/Key Derivation"
      recommended_mitigation: "Use Argon2id or scrypt; if PBKDF2 is required, use PBKDF2-HMAC-SHA256 with strong iteration count."

  # =============================================================================
  # PHP — Symmetric Crypto
  # =============================================================================

  - id: pqc-php-legacy-mcrypt
    patterns:
      - pattern-either:
          - pattern: mcrypt_encrypt(...)
          - pattern: mcrypt_decrypt(...)
          - pattern: mcrypt_module_open(...)
          - pattern: mcrypt_generic(...)
    message: "PQC CBOM Finding (Crypto-Agility=No): Deprecated mcrypt usage detected."
    languages: [php]
    severity: ERROR
    metadata:
      vulnerability: "Legacy Mcrypt Library"
      pqc_risk: "High"
      crypto_agility: "No"
      algorithm_name: "mcrypt"
      algorithm_type: "Encryption/Decryption"
      cryptographic_function: "Encryption/Decryption"
      library: "PHP mcrypt extension (deprecated)"
      purpose: "Encryption"
      recommended_mitigation: "Replace with libsodium or modern OpenSSL (AES-GCM/ChaCha20-Poly1305)."

  - id: pqc-php-openssl-weak-cipher
    patterns:
      - pattern-either:
          - pattern: openssl_encrypt(..., "des-cbc", ...)
          - pattern: openssl_encrypt(..., "des-ecb", ...)
          - pattern: openssl_encrypt(..., "des-ede3-cbc", ...)
          - pattern: openssl_encrypt(..., "rc2-cbc", ...)
          - pattern: openssl_encrypt(..., "rc4", ...)
          - pattern: openssl_encrypt(..., "bf-cbc", ...)
          - pattern: openssl_encrypt(..., "aes-128-ecb", ...)
          - pattern: openssl_encrypt(..., "aes-256-ecb", ...)
          - pattern: openssl_decrypt(..., "des-cbc", ...)
          - pattern: openssl_decrypt(..., "des-ecb", ...)
          - pattern: openssl_decrypt(..., "des-ede3-cbc", ...)
          - pattern: openssl_decrypt(..., "rc2-cbc", ...)
          - pattern: openssl_decrypt(..., "rc4", ...)
          - pattern: openssl_decrypt(..., "bf-cbc", ...)
          - pattern: openssl_decrypt(..., "aes-128-ecb", ...)
          - pattern: openssl_decrypt(..., "aes-256-ecb", ...)
    message: "PQC CBOM Finding (Crypto-Agility=No): OpenSSL weak/unsafe cipher or mode detected (DES/3DES/RC2/RC4/Blowfish/ECB). Hardcoded cipher."
    languages: [php]
    severity: ERROR
    metadata:
      vulnerability: "Hardcoded Weak Cipher (OpenSSL)"
      pqc_risk: "High"
      crypto_agility: "No"
      algorithm_name: "DES/3DES/RC2/RC4/Blowfish/ECB"
      algorithm_type: "Encryption/Decryption"
      cryptographic_function: "Encryption/Decryption"
      library: "PHP OpenSSL"
      purpose: "Encryption/Decryption"
      recommended_mitigation: "Use AEAD: AES-GCM or ChaCha20-Poly1305. Avoid ECB and legacy ciphers."

  # --- NEW: AES-CBC inventory/warn (non-AEAD) ---
  - id: pqc-php-openssl-aes-cbc-non-aead
    patterns:
      - pattern-either:
          - pattern: openssl_encrypt(..., "aes-128-cbc", ...)
          - pattern: openssl_encrypt(..., "aes-192-cbc", ...)
          - pattern: openssl_encrypt(..., "aes-256-cbc", ...)
          - pattern: openssl_decrypt(..., "aes-128-cbc", ...)
          - pattern: openssl_decrypt(..., "aes-192-cbc", ...)
          - pattern: openssl_decrypt(..., "aes-256-cbc", ...)
    message: "CBOM Finding (Crypto-Agility=Low): AES-CBC detected. CBC is not AEAD; ensure integrity (MAC/Encrypt-then-MAC) or migrate to AES-GCM/ChaCha20-Poly1305."
    languages: [php]
    severity: WARNING
    metadata:
      vulnerability: "Non-AEAD Symmetric Mode (AES-CBC)"
      pqc_risk: "Medium"
      crypto_agility: "Low"
      algorithm_name: "AES-CBC"
      algorithm_type: "Encryption/Decryption"
      cryptographic_function: "Encryption/Decryption"
      library: "PHP OpenSSL"
      purpose: "Encryption/Decryption"
      recommended_mitigation: "Prefer AEAD (AES-GCM/ChaCha20-Poly1305). If CBC required, add strong integrity protection (HMAC) correctly."

  # =============================================================================
  # PHP — Password Hashing
  # =============================================================================

  - id: pqc-php-crypt-blowfish
    patterns:
      - pattern-either:
          - pattern: crypt(...)
          - pattern: CRYPT_BLOWFISH
    message: "PQC CBOM Finding (Crypto-Agility=Low): crypt()/CRYPT_BLOWFISH detected (bcrypt/Blowfish). Plan migration strategy."
    languages: [php]
    severity: WARNING
    metadata:
      vulnerability: "Password Hashing (crypt()/Blowfish)"
      pqc_risk: "Medium"
      crypto_agility: "Low"
      algorithm_name: "bcrypt (Blowfish)"
      algorithm_type: "Hashing"
      cryptographic_function: "Password Hashing"
      library: "PHP Core"
      purpose: "Password Hashing"
      recommended_mitigation: "Prefer Argon2id via password_hash; implement rehash-on-login migration."

  - id: pqc-php-password-hash-bcrypt
    patterns:
      - pattern: password_hash(..., PASSWORD_BCRYPT, ...)
    message: "PQC CBOM Finding (Crypto-Agility=No): password_hash with PASSWORD_BCRYPT forces bcrypt (hardcoded)."
    languages: [php]
    severity: ERROR
    metadata:
      vulnerability: "Hardcoded Password Hashing (Bcrypt)"
      pqc_risk: "High"
      crypto_agility: "No"
      algorithm_name: "Bcrypt (Blowfish)"
      algorithm_type: "Hashing"
      cryptographic_function: "Password Hashing"
      library: "PHP Core"
      purpose: "Password Hashing"
      recommended_mitigation: "Prefer PASSWORD_ARGON2ID when available + rehash strategy."

  - id: pqc-php-password-hash-default
    patterns:
      - pattern: password_hash(..., PASSWORD_DEFAULT, ...)
    message: "PQC CBOM Finding (Crypto-Agility=Low): PASSWORD_DEFAULT is version-dependent; review migration readiness."
    languages: [php]
    severity: WARNING
    metadata:
      vulnerability: "Implicit Hashing Algorithm (PASSWORD_DEFAULT)"
      pqc_risk: "Medium"
      crypto_agility: "Low"
      algorithm_name: "PASSWORD_DEFAULT (version-dependent)"
      algorithm_type: "Hashing"
      cryptographic_function: "Password Hashing"
      library: "PHP Core"
      purpose: "Password Hashing"
      recommended_mitigation: "Pin to Argon2id where available; ensure password_needs_rehash() is used."

  - id: pqc-php-password-hash-argon2id
    patterns:
      - pattern-either:
          - pattern: password_hash(..., PASSWORD_ARGON2ID, ...)
          - pattern: PASSWORD_ARGON2ID
    message: "CBOM Inventory (Good Practice): Argon2id password hashing detected."
    languages: [php]
    severity: INFO
    metadata:
      category: "Inventory"
      pqc_risk: "Low"
      crypto_agility: "Medium"
      algorithm_name: "Argon2id"
      algorithm_type: "Hashing"
      cryptographic_function: "Password Hashing"
      library: "PHP Core"
      purpose: "Password Hashing"

  # =============================================================================
  # PHP — libsodium inventory (NEW)
  # =============================================================================

  - id: pqc-php-libsodium-inventory-aead
    patterns:
      - pattern-either:
          - pattern: sodium_crypto_aead_chacha20poly1305_ietf_encrypt(...)
          - pattern: sodium_crypto_aead_chacha20poly1305_ietf_decrypt(...)
          - pattern: sodium_crypto_aead_aes256gcm_encrypt(...)
          - pattern: sodium_crypto_aead_aes256gcm_decrypt(...)
          - pattern: sodium_crypto_aead_xchacha20poly1305_ietf_encrypt(...)
          - pattern: sodium_crypto_aead_xchacha20poly1305_ietf_decrypt(...)
    message: "CBOM Inventory (Good Practice): libsodium AEAD usage detected (ChaCha20-Poly1305/AES-GCM)."
    languages: [php]
    severity: INFO
    metadata:
      category: "Inventory"
      pqc_risk: "Low"
      crypto_agility: "High"
      algorithm_name: "AEAD (ChaCha20-Poly1305 / AES-GCM)"
      algorithm_type: "Encryption/Decryption"
      cryptographic_function: "Authenticated Encryption"
      library: "libsodium"
      purpose: "Encryption/Decryption"

  - id: pqc-php-libsodium-inventory-sign-kx
    patterns:
      - pattern-either:
          - pattern: sodium_crypto_sign_detached(...)
          - pattern: sodium_crypto_sign_verify_detached(...)
          - pattern: sodium_crypto_kx_client_session_keys(...)
          - pattern: sodium_crypto_kx_server_session_keys(...)
    message: "CBOM Inventory: libsodium signing or key exchange usage detected (Ed25519 / key exchange). Review PQC transition impact (asymmetric footprint)."
    languages: [php]
    severity: INFO
    metadata:
      category: "Inventory"
      pqc_risk: "Transition"
      crypto_agility: "Depends"
      algorithm_name: "Ed25519 / KX"
      algorithm_type: "Asymmetric Crypto / Key Exchange"
      cryptographic_function: "Sign/Verify / Key Agreement"
      library: "libsodium"
      purpose: "Sign/Verify / Key Exchange"

  - id: pqc-php-libsodium-inventory-pwhash
    patterns:
      - pattern-either:
          - pattern: sodium_crypto_pwhash(...)
          - pattern: sodium_crypto_pwhash_str(...)
          - pattern: sodium_crypto_pwhash_str_verify(...)
    message: "CBOM Inventory (Good Practice): libsodium password hashing (Argon2) usage detected."
    languages: [php]
    severity: INFO
    metadata:
      category: "Inventory"
      pqc_risk: "Low"
      crypto_agility: "High"
      algorithm_name: "Argon2 (libsodium pwhash)"
      algorithm_type: "Hashing"
      cryptographic_function: "Password Hashing"
      library: "libsodium"
      purpose: "Password Hashing"

  # =============================================================================
  # PHP — RNG / Token Generation
  # =============================================================================

  - id: pqc-php-insecure-rng
    patterns:
      - pattern-either:
          - pattern: rand(...)
          - pattern: mt_rand(...)
          - pattern: uniqid(...)
    message: "Security Finding: Insecure RNG primitive detected (rand/mt_rand/uniqid). If used for secrets/tokens/keys, it is not cryptographically secure."
    languages: [php]
    severity: WARNING
    metadata:
      vulnerability: "Insecure RNG"
      pqc_risk: "Medium"
      crypto_agility: "No"
      algorithm_name: "rand/mt_rand/uniqid"
      algorithm_type: "Randomness"
      cryptographic_function: "Random Number Generation"
      library: "PHP Core"
      purpose: "Token/ID generation"
      recommended_mitigation: "Use random_bytes() / random_int() for security-sensitive tokens."

  - id: pqc-php-good-rng-inventory
    patterns:
      - pattern-either:
          - pattern: random_bytes(...)
          - pattern: random_int(...)
    message: "CBOM Inventory (Good Practice): CSPRNG usage detected (random_bytes/random_int)."
    languages: [php]
    severity: INFO
    metadata:
      category: "Inventory"
      pqc_risk: "Low"
      crypto_agility: "High"
      algorithm_name: "CSPRNG"
      algorithm_type: "Randomness"
      cryptographic_function: "Random Number Generation"
      library: "PHP Core"
      purpose: "Token/Key material"

  # =============================================================================
  # PHP — TLS / SSL posture
  # =============================================================================

  - id: pqc-php-tls-disable-verify-curl
    patterns:
      - pattern-either:
          - pattern: curl_setopt(..., CURLOPT_SSL_VERIFYPEER, false)
          - pattern: curl_setopt(..., CURLOPT_SSL_VERIFYHOST, 0)
          - pattern: curl_setopt(..., CURLOPT_SSL_VERIFYHOST, false)
    message: "Security Finding: TLS certificate verification disabled in cURL (MITM risk)."
    languages: [php]
    severity: ERROR
    metadata:
      vulnerability: "TLS Verification Disabled (cURL)"
      pqc_risk: "High"
      crypto_agility: "No"
      algorithm_name: "TLS (verification disabled)"
      algorithm_type: "TLS"
      cryptographic_function: "Transport Security"
      library: "cURL"
      purpose: "HTTPS/TLS"
      recommended_mitigation: "Enable certificate verification; configure CA bundle; do not disable VERIFYHOST/VERIFYPEER."

  - id: pqc-php-stream-verify-peer-false
    patterns:
      - pattern-either:
          - pattern: |
              stream_context_create([
                "ssl" => [
                  "verify_peer" => false,
                  ...
                ],
                ...
              ])
          - pattern: |
              stream_context_create([
                "ssl" => [
                  "verify_peer_name" => false,
                  ...
                ],
                ...
              ])
          - pattern: |
              stream_context_create([
                "ssl" => [
                  "allow_self_signed" => true,
                  ...
                ],
                ...
              ])
    message: "Security Finding: TLS verification weakened in PHP stream context (verify_peer/verify_peer_name disabled or allow_self_signed enabled)."
    languages: [php]
    severity: ERROR
    metadata:
      vulnerability: "TLS Verification Weakened (Stream Context)"
      pqc_risk: "High"
      crypto_agility: "No"
      algorithm_name: "TLS (verification weakened)"
      algorithm_type: "TLS"
      cryptographic_function: "Transport Security"
      library: "PHP Streams"
      purpose: "HTTPS/TLS"
      recommended_mitigation: "Enable verification and configure CA trust; avoid allow_self_signed in production."

  # =============================================================================
  # PHP — Asymmetric Crypto Inventory + RSA weak bits (NEW)
  # =============================================================================

  - id: pqc-php-inventory-openssl-asym
    patterns:
      - pattern-either:
          - pattern: openssl_sign(...)
          - pattern: openssl_verify(...)
          - pattern: openssl_public_encrypt(...)
          - pattern: openssl_private_encrypt(...)
          - pattern: openssl_public_decrypt(...)
          - pattern: openssl_private_decrypt(...)
          - pattern: openssl_pkey_new(...)
          - pattern: openssl_pkey_get_public(...)
          - pattern: openssl_pkey_get_private(...)
    message: "CBOM Inventory (PQC Planning): OpenSSL asymmetric crypto API usage detected (RSA/ECDSA/ECDH depends on key type)."
    languages: [php]
    severity: INFO
    metadata:
      category: "Inventory"
      pqc_risk: "Transition"
      crypto_agility: "Depends"
      algorithm_name: "Asymmetric (key-type dependent)"
      algorithm_type: "Asymmetric Crypto"
      cryptographic_function: "Sign/Verify or Encrypt/Decrypt"
      library: "PHP OpenSSL"
      purpose: "Asymmetric Crypto"
      recommended_mitigation: "Inventory key types and protocols; plan PQC/hybrid transition where relevant."

  - id: pqc-php-openssl-sign-weak-digest
    patterns:
      - pattern-either:
          - pattern: openssl_sign(..., ..., ..., OPENSSL_ALGO_SHA1)
          - pattern: openssl_sign(..., ..., ..., OPENSSL_ALGO_MD5)
    message: "PQC CBOM Finding (Crypto-Agility=No): openssl_sign uses weak digest (SHA1/MD5)."
    languages: [php]
    severity: ERROR
    metadata:
      vulnerability: "Weak Digest in Signature (OpenSSL)"
      pqc_risk: "High"
      crypto_agility: "No"
      algorithm_name: "SHA1/MD5"
      algorithm_type: "Signature Digest"
      cryptographic_function: "Digital Signature"
      library: "PHP OpenSSL"
      purpose: "Sign/Verify"
      recommended_mitigation: "Use SHA-256+ digests; review signature scheme and migration plan."

  - id: pqc-php-openssl-rsa-weak-keysize
    patterns:
      - pattern-either:
          - pattern: |
              openssl_pkey_new([
                ...,
                "private_key_bits" => 1024,
                ...
              ])
          - pattern: |
              openssl_pkey_new([
                ...,
                "private_key_bits" => "1024",
                ...
              ])
    message: "Security Finding: RSA key generation with weak modulus size (1024-bit) detected."
    languages: [php]
    severity: ERROR
    metadata:
      vulnerability: "Weak RSA Key Size"
      pqc_risk: "High"
      crypto_agility: "No"
      algorithm_name: "RSA-1024"
      algorithm_type: "Asymmetric Crypto"
      cryptographic_function: "Key Generation"
      library: "PHP OpenSSL"
      purpose: "Asymmetric Key Generation"
      recommended_mitigation: "Use RSA 2048/3072+ (or modern curves). Plan PQC migration for long-term."

  # =============================================================================
  # PHP — JWT Inventory (common asymmetric surface)
  # =============================================================================

  - id: pqc-php-jwt-firebase-encode
    patterns:
      - pattern-either:
          - pattern: "\\Firebase\\JWT\\JWT::encode(...)"
          - pattern: "JWT::encode(...)"
    message: "CBOM Inventory (PQC Planning): PHP JWT encode detected. Review signing algorithm (HS*/RS*/ES*/EdDSA) and crypto-agility."
    languages: [php]
    severity: INFO
    metadata:
      category: "Inventory"
      pqc_risk: "Transition"
      crypto_agility: "Depends"
      algorithm_name: "JWT signing (algorithm-dependent)"
      algorithm_type: "Token Signature"
      cryptographic_function: "Digital Signature / MAC"
      library: "firebase/php-jwt (likely)"
      purpose: "Authentication/Authorization"
      recommended_mitigation: "Inventory JWT algorithms used (RS256/ES256/etc). Implement rotation and policy-driven algorithm selection."

  - id: pqc-php-jwt-firebase-decode
    patterns:
      - pattern-either:
          - pattern: "\\Firebase\\JWT\\JWT::decode(...)"
          - pattern: "JWT::decode(...)"
    message: "CBOM Inventory: PHP JWT decode detected. Review verification options (accepted algorithms, key selection) to prevent algorithm confusion."
    languages: [php]
    severity: INFO
    metadata:
      category: "Inventory"
      pqc_risk: "Transition"
      crypto_agility: "Depends"
      algorithm_name: "JWT verification (algorithm-dependent)"
      algorithm_type: "Token Verification"
      cryptographic_function: "Verify"
      library: "firebase/php-jwt (likely)"
      purpose: "Authentication/Authorization"
      recommended_mitigation: "Ensure accepted algorithms are constrained and validated; keep crypto policy centralized."

  # =============================================================================
  # PHP — Hardcoded key material (NEW)
  # =============================================================================

  - id: pqc-php-hardcoded-pem-private-key
    patterns:
      - pattern-regex: "-----BEGIN (RSA )?PRIVATE KEY-----"
    message: "Security Finding: Hardcoded PEM private key material detected in source code."
    languages: [php]
    severity: ERROR
    metadata:
      vulnerability: "Hardcoded Private Key"
      pqc_risk: "High"
      crypto_agility: "No"
      algorithm_name: "PEM Private Key"
      algorithm_type: "Key Material"
      cryptographic_function: "Key Management"
      library: "N/A"
      purpose: "Key Storage"
      recommended_mitigation: "Remove embedded keys from source. Store in secure keystore/secret manager/HSM with rotation."

  - id: pqc-php-hardcoded-pem-certificate
    patterns:
      - pattern-regex: "-----BEGIN CERTIFICATE-----"
    message: "CBOM Inventory/Security Finding: Embedded certificate detected in source code. Review if intentional (pinning) and manage lifecycle."
    languages: [php]
    severity: WARNING
    metadata:
      vulnerability: "Embedded Certificate"
      pqc_risk: "Medium"
      crypto_agility: "Low"
      algorithm_name: "X.509 Certificate"
      algorithm_type: "Certificate Material"
      cryptographic_function: "Certificate Management"
      library: "N/A"
      purpose: "Trust/PIN/Transport"
      recommended_mitigation: "If pinning, manage rotation and expiry. Prefer platform trust store unless justified."

  # =============================================================================
  # PHP — "Not encryption" patterns (NEW)
  # =============================================================================

  - id: pqc-php-not-encryption-base64
    patterns:
      - pattern-either:
          - pattern: base64_encode(...)
          - pattern: base64_decode(...)
    message: "CBOM Note: base64_encode/base64_decode detected. Base64 is encoding, not encryption. Review if misused to protect sensitive data."
    languages: [php]
    severity: INFO
    metadata:
      category: "Misuse Signal"
      pqc_risk: "Low"
      crypto_agility: "N/A"
      algorithm_name: "Base64 (encoding)"
      algorithm_type: "Encoding"
      cryptographic_function: "Encoding"
      library: "PHP Core"
      purpose: "Data transformation"
      recommended_mitigation: "If confidentiality is required, use proper encryption (AEAD)."

  - id: pqc-php-not-encryption-rot13
    patterns:
      - pattern: str_rot13(...)
    message: "Security Finding: str_rot13 detected. ROT13 is not encryption. Review for sensitive data handling."
    languages: [php]
    severity: WARNING
    metadata:
      vulnerability: "Weak/Non-Crypto Obfuscation (ROT13)"
      pqc_risk: "Medium"
      crypto_agility: "N/A"
      algorithm_name: "ROT13"
      algorithm_type: "Obfuscation"
      cryptographic_function: "Obfuscation"
      library: "PHP Core"
      purpose: "Data hiding"
      recommended_mitigation: "Replace with proper cryptography if confidentiality/integrity is required."

  # =============================================================================
  # JS/TS — Weak Hash / MAC
  # =============================================================================

  - id: pqc-js-weak-hash-node
    patterns:
      - pattern-either:
          - pattern: crypto.createHash('md5')
          - pattern: crypto.createHash("md5")
          - pattern: crypto.createHash('sha1')
          - pattern: crypto.createHash("sha1")
    message: "PQC CBOM Finding (Crypto-Agility=No): [Node.js] Weak hash algorithm usage detected (MD5/SHA1)."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      vulnerability: "Weak Hash (MD5/SHA1)"
      pqc_risk: "High"
      crypto_agility: "No"
      algorithm_name: "MD5/SHA1"
      algorithm_type: "Hashing"
      cryptographic_function: "Hashing"
      library: "node:crypto"
      purpose: "Hashing"
      recommended_mitigation: "Use SHA-256/SHA-512 or stronger; avoid MD5/SHA1 for security."

  - id: pqc-js-weak-hmac-node
    patterns:
      - pattern-either:
          - pattern: crypto.createHmac('md5', ...)
          - pattern: crypto.createHmac("md5", ...)
          - pattern: crypto.createHmac('sha1', ...)
          - pattern: crypto.createHmac("sha1", ...)
    message: "PQC CBOM Finding (Crypto-Agility=No): [Node.js] Weak HMAC algorithm selected (MD5/SHA1)."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      vulnerability: "Weak HMAC (MD5/SHA1)"
      pqc_risk: "High"
      crypto_agility: "No"
      algorithm_name: "HMAC-MD5/HMAC-SHA1"
      algorithm_type: "MAC"
      cryptographic_function: "Message Authentication"
