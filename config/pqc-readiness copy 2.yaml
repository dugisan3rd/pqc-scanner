  # 3) Weak RSA padding detection (legacy / risky)
  # =============================================================================

  # --- Node: crypto.publicEncrypt/privateDecrypt padding flags ---
  - id: pqc-js-rsa-weak-padding
    patterns:
      - pattern-either:
          - pattern: "crypto.publicEncrypt({ ..., padding: crypto.constants.RSA_PKCS1_PADDING, ... }, ...)"
          - pattern: "crypto.privateDecrypt({ ..., padding: crypto.constants.RSA_PKCS1_PADDING, ... }, ...)"
          - pattern: "crypto.publicEncrypt({ ..., padding: crypto.constants.RSA_NO_PADDING, ... }, ...)"
          - pattern: "crypto.privateDecrypt({ ..., padding: crypto.constants.RSA_NO_PADDING, ... }, ...)"
