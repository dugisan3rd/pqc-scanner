rules:
- id: catalog.crypto.protocols
  languages:
  - generic
  severity: INFO
  message: Crypto/TLS catalog token detected (protocol matrix entry present). Use metadata.crypto_catalog for full mapping.
  pattern-regex: (?i)\b(3DES|3DES_EDE_CBC|AES|AES\-128|AES\-192|AES\-256|AES\-CCM|AES\-CCMP|AES\-CTR|AES\-GCM|AES128|AES256|AES256_CTR|AES_128_CBC|AES_256_CBC|CHACHA20_POLY1305|Camellia|Camellia\-128|Camellia\-192|Camellia\-256|Certs/PSK|ChaCha20|ChaCha20\-Poly1305|ChaCha20\-poly1305|Curve25519|DES|DES3\-CBC|DES3\-KD|DES_CBC|DSA|ECDSA|ECDSA\-SHA256|ES256|Ed25519|EdDSA|ElGamal|HMAC|HMAC\-SHA1|HMAC\-SHA1/2|HMAC\-SHA256|HMAC/Poly1305|HMAC_MD5|HMAC_SHA1|HMAC_SHA1_96|HMAC_SHA256|HS256|MD5|PSK|Passphrase/PSK|Poly1305|RC4|RC4_128|RS256|RSA/ECDSA|RSAES\-PKCS1\-v1_5|RSASSA\-PKCS1\-v1_5|SAE|SHA\-1|SHA\-2|SHA\-256|SHA\-3|SHA\-384|SHA\-512|TLS_AES_128_GCM_SHA256|TLS_CHACHA20_POLY1305_SHA256|TLS_DHE_RSA_WITH_AES_128_GCM_SHA256|TLS_DH_RSA_WITH_AES_128_CBC_SHA|TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256|TLS_RSA_WITH_AES_256_GCM_SHA384|Twofish|Twofish\-256|X25519|ecdsa_secp256r1_sha256|md5WithRSAEncryption|rsa_pss_rsae_sha256|secp256k1)\b
  metadata:
    category: crypto-catalog
    purpose: inventory
    crypto_catalog:
      TLS 1.2:
        key_exchange:
        - name: RSA
          type: Asymmetric
          example: TLS_RSA_WITH_AES_256_GCM_SHA384
          key_bits: 2048–4096
          ref: https://datatracker.ietf.org/doc/html/rfc5246
        - name: DH
          type: Asymmetric
          example: TLS_DH_RSA_WITH_AES_128_CBC_SHA
          key_bits: '2048'
          ref: ''
        - name: ECDHE
          type: Asymmetric
          example: TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
          key_bits: '256'
          ref: ''
        - name: DHE
          type: Asymmetric
          example: TLS_DHE_RSA_WITH_AES_128_GCM_SHA256
          key_bits: '2048'
          ref: ''
        encryption:
        - name: AES
          type: Symmetric
          examples:
          - AES_128_CBC
          - AES_256_CBC
          key_bits: 128–256
          ref: ''
        - name: RC4
          type: Symmetric
          examples:
          - RC4_128
          key_bits: '128'
          ref: ''
        - name: 3DES
          type: Symmetric
          examples:
          - 3DES_EDE_CBC
          key_bits: '168'
          ref: ''
        - name: ChaCha20
          type: Symmetric
          examples:
          - ChaCha20-Poly1305
          key_bits: '256'
          ref: ''
        mac:
        - name: MD5
          type: Symmetric
          examples:
          - HMAC_MD5
          key_bits: '128'
          ref: ''
        - name: HMAC-SHA1
          type: Symmetric
          examples:
          - HMAC_SHA1
          key_bits: '160'
          ref: ''
        - name: HMAC-SHA256
          type: Symmetric
          examples:
          - HMAC_SHA256
          key_bits: '256'
          ref: ''
        signatures:
        - name: RSA
          type: Asymmetric
          example: RSA-SHA256
          key_bits: 2048–4096
          ref: https://datatracker.ietf.org/doc/html/rfc5246
        - name: ECDSA
          type: Asymmetric
          example: ECDSA-SHA256
          key_bits: '256'
          ref: https://datatracker.ietf.org/doc/html/rfc5246
        authentication:
        - name: X.509 Certs
          type: Asymmetric
          example: Certificate field
          key_bits: Varies
          ref: https://datatracker.ietf.org/doc/html/rfc5280
        cipher_suites:
        - TLS_RSA_WITH_AES_256_GCM_SHA384
        - TLS_DH_RSA_WITH_AES_128_CBC_SHA
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_DHE_RSA_WITH_AES_128_GCM_SHA256
      TLS 1.3:
        key_exchange:
        - name: ECDHE
          type: Asymmetric
          curves:
          - P-256
          - P-384
          - P-521
          example: TLS_AES_128_GCM_SHA256
          key_bits: '256'
          ref: ''
        encryption:
        - name: AES-GCM
          type: Symmetric
          examples:
          - TLS_AES_128_GCM_SHA256
          key_bits: 128–256
          ref: https://datatracker.ietf.org/doc/html/rfc8446#section-6.3
        - name: ChaCha20-Poly1305
          type: Symmetric
          examples:
          - TLS_CHACHA20_POLY1305_SHA256
          key_bits: '256'
          ref: https://datatracker.ietf.org/doc/html/rfc8439
        mac:
        - name: Poly1305 (with ChaCha20)
          type: Symmetric
          examples:
          - CHACHA20_POLY1305
          key_bits: '256'
          ref: ''
        signatures:
        - name: RSA-PSS
          type: Asymmetric
          hashes:
          - SHA-256
          - SHA-384
          - SHA-512
          example: rsa_pss_rsae_sha256
          key_bits: 2048–4096
          ref: ''
        - name: ECDSA
          type: Asymmetric
          hashes:
          - SHA-256
          - SHA-384
          - SHA-512
          example: ecdsa_secp256r1_sha256
          key_bits: '256'
          ref: ''
        authentication:
        - name: X.509 Certs
          type: Asymmetric
          example: subjectPublicKeyInfo
          key_bits: Varies
          ref: ''
        cipher_suites:
        - TLS_AES_128_GCM_SHA256
        - TLS_CHACHA20_POLY1305_SHA256
      IPSec:
        key_exchange:
        - name: DH/ECDH
          type: Asymmetric
          example: 'ESP/AH headers: Encryption Algorithm, Integrity Algorithm, DH Group'
          key_bits: '2048'
          ref: ''
        encryption:
        - name: AES
          type: Symmetric
          example: 'ESP/AH headers: Encryption Algorithm, Integrity Algorithm, DH Group'
          key_bits: 128–256
          ref: ''
        - name: 3DES
          type: Symmetric
          example: 'ESP/AH headers: Encryption Algorithm, Integrity Algorithm, DH Group'
          key_bits: '168'
          ref: https://datatracker.ietf.org/doc/html/rfc6071
        integrity:
        - name: HMAC-SHA1/2
          type: Symmetric
          example: 'ESP/AH headers: Encryption Algorithm, Integrity Algorithm, DH Group'
          key_bits: Depends on hash
          ref: ''
        authentication:
        - name: RSA certs
          type: Asymmetric
          example: 'ESP/AH headers: Encryption Algorithm, Integrity Algorithm, DH Group'
          key_bits: 2048–4096
          ref: ''
        - name: PSK
          type: Symmetric
          example: 'ESP/AH headers: Encryption Algorithm, Integrity Algorithm, DH Group'
          key_bits: 128–256
          ref: ''
      SSH:
        key_exchange:
        - name: DH/ECDH
          type: Asymmetric
          example: kex, cipher, mac, hostkey
          key_bits: '2048'
          ref: ''
        encryption:
        - name: AES
          type: Symmetric
          examples:
          - AES-128
          - AES-256
          key_bits: 128–256
          ref: https://datatracker.ietf.org/doc/html/rfc6668
        - name: ChaCha20
          type: Symmetric
          examples:
          - ChaCha20-poly1305
          key_bits: '256'
          ref: https://datatracker.ietf.org/doc/html/rfc8439
        integrity:
        - name: HMAC
          type: Symmetric
          hashes:
          - SHA-256
          - SHA-512
          key_bits: Depends on hash
          ref: https://datatracker.ietf.org/doc/html/rfc6668
        signatures:
        - name: RSA
          type: Asymmetric
          key_bits: 2048–4096
          ref: ''
        - name: ECDSA
          type: Asymmetric
          hashes:
          - SHA-256
          - SHA-384
          - SHA-512
          key_bits: '256'
          ref: https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.186-5.pdf
        - name: Ed25519
          type: Asymmetric
          hash: SHA-512
          key_bits: '256'
          ref: ''
        authentication:
        - name: Password
          type: Symmetric
          key_bits: Varies / Protocol-defined
          ref: thesis.pdf
        - name: Pubkey
          type: Asymmetric
          key_bits: Varies / Protocol-defined
          ref: https://datatracker.ietf.org/doc/html/rfc4252
      OpenPGP:
        key_exchange:
        - name: ElGamal
          type: Asymmetric
          key_bits: '2048'
          ref: https://datatracker.ietf.org/doc/html/rfc4880
        - name: DH
          type: Asymmetric
          key_bits: '2048'
          ref: ''
        encryption:
        - name: AES
          type: Symmetric
          examples:
          - AES-128
          - AES-192
          - AES-256
          key_bits: 128–256
          ref: ''
        - name: Camellia
          type: Symmetric
          examples:
          - Camellia-128
          - Camellia-192
          - Camellia-256
          key_bits: 128–256
          ref: ''
        - name: Twofish
          type: Symmetric
          examples:
          - Twofish-256
          key_bits: '256'
          ref: ''
        integrity:
        - name: HMAC
          type: Symmetric
          hashes:
          - SHA-2
          - SHA-3
          ref: ''
        signatures:
        - name: RSA
          type: Asymmetric
          key_bits: 2048–4096
          ref: ''
        - name: DSA
          type: Asymmetric
          hashes:
          - SHA-256
          - SHA-384
          - SHA-512
          key_bits: '2048'
          ref: ''
        - name: ECDSA
          type: Asymmetric
          hash: SHA-1
          key_bits: '256'
          ref: ''
        authentication:
        - name: Sig verification
          type: Asymmetric
          ref: https://datatracker.ietf.org/doc/html/rfc4880
      S/MIME:
        encryption:
        - name: AES
          type: Symmetric
          examples:
          - AES-128 GCM
          - AES-256 GCM
          - AES-128 CBC
          key_bits: 128,256
          ref: https://datatracker.ietf.org/doc/html/rfc8551#section-3.3
        - name: 3DES
          type: Symmetric
          key_bits: '168'
          ref: ''
        integrity:
        - name: SHA2/3 (usage)
          type: Symmetric
          key_bits: Depends on hash
          ref: ''
        signatures:
        - name: RSA
          type: Asymmetric
          hashes:
          - SHA-256
          - SHA-1
          key_bits: 2048–4096
          ref: ''
        - name: ECDSA
          type: Asymmetric
          curve: P-256
          hash: SHA-256
          key_bits: '256'
          ref: ''
        authentication:
        - name: X.509 certs
          type: Asymmetric
          key_bits: Varies / Protocol-defined
          ref: ''
      Signal:
        key_exchange:
        - name: 'X3DH: Curve25519'
          type: Asymmetric
          examples:
          - X3DH
          - Curve25519
          ref: https://medium.com/@janelle.wg/demystifying-the-signal-protocol-for-end-to-end-encryption-c93250e6043e
        encryption:
        - name: AES-CTR
          type: Symmetric
          example: AES256_CTR
          key_bits: 128–256
          ref: ''
        integrity:
        - name: HMAC-SHA256
          type: Symmetric
          key_bits: Depends on hash
          ref: ''
        authentication:
        - name: Identity keys Curve25519
          type: Mixed
          key_bits: '256'
          ref: https://medium.com/@janelle.wg/demystifying-the-signal-protocol-for-end-to-end-encryption-c93250e6043e
      Kerberos:
        encryption:
        - name: AES
          type: Symmetric
          examples:
          - AES256
          - AES128
          key_bits: 128–256
          ref: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/network-security-configure-encryption-types-allowed-for-kerberos
        - name: DES
          type: Symmetric
          examples:
          - DES_CBC
          key_bits: '56'
          ref: RFC 4120
        - name: 3DES
          type: Symmetric
          examples:
          - DES3-KD
          - DES3-CBC
          key_bits: '192'
          ref: RFC 4120
        integrity:
        - name: HMAC_MD5
          type: Symmetric
          key_bits: '128'
          ref: RFC 4120
        - name: HMAC-SHA1
          type: Symmetric
          examples:
          - HMAC_SHA1_96
          key_bits: '96'
          ref: RFC 4120
        authentication:
        - name: Tickets/password-derived keys; PKINIT certs (optional)
          type: Mixed
          ref: https://datatracker.ietf.org/doc/html/rfc8636
      WireGuard:
        key_exchange:
        - name: Curve25519
          type: Asymmetric
          key_bits: '256'
          ref: https://datatracker.ietf.org/doc/html/rfc7748
        encryption:
        - name: ChaCha20
          type: Symmetric
          integrity: Poly1305
          key_bits: '256'
          ref: 'WireGuard: Next Generation Kernel Network Tunnel'
        integrity:
        - name: Poly1305
          type: Symmetric
          key_bits: '256'
          ref: ''
        authentication:
        - name: Static public keys
          type: Asymmetric
          key_bits: '256'
          ref: https://datatracker.ietf.org/doc/html/rfc7748
      Zigbee:
        encryption:
        - name: AES-CCM
          type: Symmetric
          integrity: CBC-MAC
          key_bits: 128–256
          ref: 'ZigBee Security: Basics (Part 2) – Kudelski Security Research'
        integrity:
        - name: AES-CCM MIC
          type: Symmetric
          key_bits: 128–256
          ref: 'AN1233: Zigbee Security'
        authentication:
        - name: Network/Link keys
          type: Symmetric
          mode: AES-CTR
          ref: ''
      WPA2 / WPA3:
        key_exchange:
        - name: SAE
          type: Asymmetric-style
          key_bits: '256'
          ref: https://www.wi-fi.org/system/files/WPA3%20Specification%20v3.4.pdf
        - name: PSK
          type: Symmetric
          hash: HMAC-SHA1
          key_bits: 128–256
          ref: https://standards.ieee.org/ieee/802.11i/3127
        encryption:
        - name: AES-CCMP
          type: Symmetric
          key_bits: 128–256
          ref: https://datatracker.ietf.org/doc/html/rfc4309
        integrity:
        - name: HMAC-SHA256
          type: Symmetric
          key_bits: Depends on hash
          ref: IEEE 802.11w; IEEE 802.11-2016/2020
        authentication:
        - name: Passphrase/PSK
          type: Symmetric
          ref: ''
        - name: SAE creds (A-PAKE)
          type: Asymmetric
          ref: https://www.wi-fi.org/system/files/WPA3%20Specification%20v3.4.pdf
      DNSSEC:
        signatures:
        - name: RSA
          type: Asymmetric
          key_bits: 2048–4096
          ref: ''
        - name: ECDSA
          type: Asymmetric
          curves:
          - P-256
          - P-384
          hashes:
          - SHA-256
          - SHA-384
          key_bits: '256'
          ref: https://datatracker.ietf.org/doc/html/rfc6605
        - name: EdDSA
          type: Asymmetric
          hash: SHAKE-256
          key_bits: '256'
          ref: https://datatracker.ietf.org/doc/html/rfc8080#section-6.2
        authentication:
        - name: DNSKEY/RRSIG validation
          type: Asymmetric
          ref: https://datatracker.ietf.org/doc/html/rfc4034
      QUIC (TLS 1.3):
        key_exchange:
        - name: ECDHE
          type: Mixed
          example: inherits TLS naming (e.g., TLS_AES_128_GCM_SHA256)
          ref: ''
        encryption:
        - name: AES-GCM
          type: Symmetric
          ref: https://datatracker.ietf.org/doc/html/rfc8446
        - name: ChaCha20-Poly1305
          type: Symmetric
          ref: https://datatracker.ietf.org/doc/html/rfc8446
        integrity:
        - name: AEAD tags
          type: Symmetric
          ref: ''
        signatures:
        - name: RSA
          type: Mixed
          ref: ''
        - name: ECDSA
          type: Mixed
          ref: ''
        authentication:
        - name: Certs
          type: Mixed
          ref: ''
        research_ref: '[2405.09264] A Quantum of QUIC: Dissecting Cryptography with Post-Quantum Insights'
      Bitcoin:
        signatures:
        - name: ECDSA
          type: Asymmetric
          curve: secp256k1
          key_bits: '256'
          ref: https://datatracker.ietf.org/doc/html/rfc6090
        authentication:
        - name: Ownership via signs
          type: Asymmetric
          curve: secp256k1
          ref: ''
      Tor:
        key_exchange:
        - name: DH
          type: Asymmetric
          curve: Curve25519
          key_bits: '2048'
          ref: https://datatracker.ietf.org/doc/html/rfc3526
        - name: RSA
          type: Asymmetric
          examples:
          - RSAES-PKCS1-v1_5
          - RSASSA-PKCS1-v1_5
          key_bits: 2048–4096
          ref: https://datatracker.ietf.org/doc/html/rfc8017
        encryption:
        - name: AES
          type: Symmetric
          mode: AES-128 CTR
          ref: https://datatracker.ietf.org/doc/html/rfc3268
        integrity:
        - name: SHA1 digest / TLS MACs (usage)
          type: Symmetric
          hash: HMAC-SHA1
          ref: https://datatracker.ietf.org/doc/html/rfc5246
        authentication:
        - name: Onion handshake keys
          type: Mixed
          ref: ''
      iMessage:
        key_exchange:
        - name: Curve25519
          type: Mixed
          example: X25519
          key_bits: '256'
          ref: https://datatracker.ietf.org/doc/html/rfc7748
        encryption:
        - name: AES
          type: Symmetric
          mode: AES-GCM
          ref: ''
        integrity:
        - name: HMAC
          type: Symmetric
          hash: HMAC-SHA256
          ref: https://datatracker.ietf.org/doc/html/rfc2104
        authentication:
        - name: Apple ID cert chain
          type: Mixed
          algs:
          - RSA
          - ECDSA
          ref: ''
      OAuth / OIDC:
        integrity:
        - name: HMAC (JWT HS256)
          type: Symmetric
          ref: https://datatracker.ietf.org/doc/html/rfc7519#section-7.1
        signatures:
        - name: RSA
          type: Mixed
          algs:
          - RS256
          - RS384
          - RS512
          ref: https://datatracker.ietf.org/doc/html/rfc7518
        - name: ECDSA
          type: Mixed
          algs:
          - ES256
          - ES384
          - ES512
          ref: https://datatracker.ietf.org/doc/html/rfc7518
        - name: EdDSA
          type: Mixed
          algs:
          - Ed25519
          - Ed448
          ref: https://datatracker.ietf.org/doc/html/rfc8037
        - name: HMAC
          type: Symmetric
          algs:
          - HS256
          - HS384
          - HS512
          ref: https://datatracker.ietf.org/doc/html/rfc7518
        authentication:
        - name: 'Tokens: client secret or JWK'
          type: Mixed
          ref: https://datatracker.ietf.org/doc/html/rfc6749
      FIDO2 / WebAuthn:
        integrity:
        - name: Hash (usage)
          type: Asymmetric
          ref: https://developers.yubico.com/python-fido2/API_Documentation/autoapi/fido2/webauthn/index.html
        signatures:
        - name: ECDSA
          type: Asymmetric
          alg: ES256
          ref: https://datatracker.ietf.org/doc/html/draft-ietf-cose-webauthn-algorithms-01
        - name: EdDSA
          type: Asymmetric
          ref: https://developers.yubico.com/WebAuthn/Concepts/Using_WebAuthn_for_Signing.html
        authentication:
        - name: Public-key assertions
          type: Asymmetric
          ref: https://en.wikipedia.org/wiki/WebAuthn
      MACsec:
        encryption:
        - name: AES-GCM
          type: Symmetric
          key_bits: 128–256
          ref: https://ieeexplore.ieee.org/abstract/document/9044731
        integrity:
        - name: AES-GCM tag
          type: Symmetric
          key_bits: 128–256
          ref: https://ieeexplore.ieee.org/abstract/document/9044731
        authentication:
        - name: PSK / 802.1X creds
          type: Symmetric/Mixed
          ref: https://info.support.huawei.com/info-finder/encyclopedia/en/MACsec.html
      OpenVPN:
        key_exchange:
        - name: DH/ECDH
          type: Asymmetric
          key_bits: '2048'
          ref: https://datatracker.ietf.org/doc/html/rfc2409
        - name: RSA
          type: Asymmetric
          example: easy-rsa
          key_bits: '1024'
          ref: https://openvpn.net/community-docs/setting-up-your-own-certificate-authority--ca--and-generating-certificates-and-keys-for-an-openvpn-server-and-multiple-clients.html
        encryption:
        - name: AES
          type: Symmetric
          modes:
          - CBC
          - GCM
          ref: NIST SP 800-38; RFC2104
        - name: Camellia
          type: Symmetric
          ref: RFC6367
        integrity:
        - name: HMAC
          type: Symmetric
          hashes:
          - SHA-1
          - SHA-256
          - SHA-512
          ref: RFC3174; RFC 6234
        signatures:
        - name: MD5
          type: Asymmetric
          example: md5WithRSAEncryption
          ref: https://openvpn.net/connect-docs/md5-signature-algorithm-support.html
        authentication:
        - name: Static key or TLS certs or HMAC using SHA1
          type: Mixed
          ref: https://openvpn.net/community-resources/reference-manual-for-openvpn-2-4/
      DTLS:
        key_exchange:
        - name: (EC)DHE/RSA
          type: Mixed
          ref: https://www.redhat.com/en/blog/understanding-dtls-all-zero-clienthellorandom-vulnerability
        encryption:
        - name: ChaCha20
          type: Symmetric
          integrity: Poly1305
          ref: RFC 9147
        - name: AES
          type: Symmetric
          modes:
          - AES-GCM
          - AES-CCM
          ref: RFC 9147
        integrity:
        - name: HMAC/Poly1305
          type: Symmetric
          ref: RFC 9147
        signatures:
        - name: RSA/ECDSA
          type: Mixed
          ref: https://www.redhat.com/en/blog/understanding-dtls-all-zero-clienthellorandom-vulnerability
        authentication:
        - name: Certs/PSK
          type: Mixed
          ref: https://www.redhat.com/en/blog/understanding-dtls-all-zero-clienthellorandom-vulnerability
- id: inv.crypto.keywords.any
  languages:
  - generic
  message: 'Inventory: crypto-related keywords detected (broad). Use to locate configs/docs/code references.'
  severity: INFO
  pattern-regex: (?i)\b(crypto|cipher|ciphersuite|ciphersuites|key exchange|keyexchange|kem|signature scheme|x509|certificate|csr|pkcs|jwt|jwe|jws|tls|ssl|ssh|ipsec|ike|saml|oauth|oidc|keystore|truststore|kms|hsm)\b
  metadata:
    category: inventory
    tier: E
    confidence: low
- id: inv.crypto.libs.any
  languages:
  - generic
  message: 'Inventory: crypto library keyword detected (OpenSSL/BoringSSL/libsodium/mbedTLS/wolfSSL/Botan/Crypto++/NaCl/WebCrypto).'
  severity: INFO
  pattern-regex: (?i)\b(openssl|boringssl|libressl|libsodium|sodium|mbedtls|wolfssl|botan|crypto\+\+|cryptopp|nacl|tweetnacl|webcrypto)\b
  metadata:
    category: inventory
    tier: B
    confidence: low
- id: inv.dh.dsa.legacy.multilang
  languages:
  - python
  - java
  - go
  - javascript
  - typescript
  - c
  - cpp
