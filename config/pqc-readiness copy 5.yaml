      library_module: PHP Core
      key_length: variable
      purpose_usage: Token/Key material
- id: pqc-php-tls-disable-verify-curl
  patterns:
  - pattern-either:
    - pattern: curl_setopt(..., CURLOPT_SSL_VERIFYPEER, false)
    - pattern: curl_setopt(..., CURLOPT_SSL_VERIFYHOST, 0)
    - pattern: curl_setopt(..., CURLOPT_SSL_VERIFYHOST, false)
  message: 'Security Finding: TLS certificate verification disabled in cURL (MITM risk).'
  languages:
  - php
  severity: ERROR
  metadata:
    vulnerability: TLS Verification Disabled (cURL)
    pqc_risk: High
    crypto_agility: 'No'
    algorithm_name: TLS (verification disabled)
    algorithm_type: TLS
    cryptographic_function: Transport Security
    library: cURL
    purpose: HTTPS/TLS
    recommended_mitigation: Enable certificate verification; configure CA bundle; do not disable VERIFYHOST/VERIFYPEER.
    cbom:
      cryptographic_function: Transport Security
      algorithm_used: TLS (verification disabled)
      algorithm_category: TLS
      library_module: cURL
      key_length: variable
      purpose_usage: HTTPS/TLS
- id: pqc-php-stream-verify-peer-false
  patterns:
  - pattern-either:
    - pattern: "stream_context_create([\n  \"ssl\" => [\n    \"verify_peer\" => false,\n    ...\n  ],\n  ...\n])\n"
    - pattern: "stream_context_create([\n  \"ssl\" => [\n    \"verify_peer_name\" => false,\n    ...\n  ],\n  ...\n])\n"
    - pattern: "stream_context_create([\n  \"ssl\" => [\n    \"allow_self_signed\" => true,\n    ...\n  ],\n  ...\n])\n"
  message: 'Security Finding: TLS verification weakened in PHP stream context (verify_peer/verify_peer_name disabled or allow_self_signed
    enabled).'
  languages:
  - php
  severity: ERROR
  metadata:
    vulnerability: TLS Verification Weakened (Stream Context)
    pqc_risk: High
    crypto_agility: 'No'
    algorithm_name: TLS (verification weakened)
    algorithm_type: TLS
    cryptographic_function: Transport Security
    library: PHP Streams
    purpose: HTTPS/TLS
    recommended_mitigation: Enable verification and configure CA trust; avoid allow_self_signed in production.
    cbom:
      cryptographic_function: Transport Security
      algorithm_used: TLS (verification weakened)
      algorithm_category: TLS
      library_module: PHP Streams
      key_length: variable
      purpose_usage: HTTPS/TLS
