rules:
- id: pqc-php-weak-hash-direct
  patterns:
  - pattern-either:
    - pattern: md5(...)
    - pattern: sha1(...)
  message: 'PQC CBOM Finding (Crypto-Agility=No): Weak hash (MD5/SHA1) detected via direct function call.'
  languages:
  - php
  severity: ERROR
  metadata:
    vulnerability: Weak Hash (MD5/SHA1)
    pqc_risk: High
    crypto_agility: 'No'
    algorithm_name: MD5/SHA1
    algorithm_type: Hashing
    cryptographic_function: Hashing
    library: PHP Core
    purpose: Hashing
    recommended_mitigation: Use SHA-256/SHA-512 (or stronger). Do not use MD5/SHA1 for security decisions.
    cbom:
      cryptographic_function: Hashing
      algorithm_used: MD5/SHA1
      algorithm_category: Hashing
      library_module: PHP Core
      key_length: variable
      purpose_usage: Hashing
- id: pqc-php-weak-hash-hash-api
  patterns:
  - pattern-either:
    - pattern: hash("md5", ...)
    - pattern: hash('md5', ...)
    - pattern: hash("sha1", ...)
    - pattern: hash('sha1', ...)
    - pattern: hash_hmac("md5", ...)
    - pattern: hash_hmac('md5', ...)
    - pattern: hash_hmac("sha1", ...)
    - pattern: hash_hmac('sha1', ...)
  message: 'PQC CBOM Finding (Crypto-Agility=No): Weak algorithm selected via hash/hash_hmac (MD5/SHA1).'
  languages:
  - php
  severity: ERROR
  metadata:
    vulnerability: Weak Hash/MAC Selection (hash/hash_hmac)
    pqc_risk: High
    crypto_agility: 'No'
    algorithm_name: MD5/SHA1
    algorithm_type: Hashing / MAC
    cryptographic_function: Hashing / Message Authentication
    library: PHP Core
    purpose: Hashing/MAC
    recommended_mitigation: Use HMAC-SHA-256 or HMAC-SHA-512; avoid MD5/SHA1.
    cbom:
      cryptographic_function: Hashing / Message Authentication
      algorithm_used: MD5/SHA1
      algorithm_category: Hashing / MAC
      library_module: PHP Core
      key_length: variable
      purpose_usage: Hashing/MAC
- id: pqc-php-weak-pbkdf2-sha1
  patterns:
  - pattern-either:
    - pattern: hash_pbkdf2("sha1", ...)
    - pattern: hash_pbkdf2('sha1', ...)
    - pattern: openssl_pbkdf2(..., ..., ..., ..., "sha1")
    - pattern: openssl_pbkdf2(..., ..., ..., ..., 'sha1')
  message: 'PQC CBOM Finding (Crypto-Agility=No): PBKDF2 configured with SHA1 detected.'
  languages:
  - php
  severity: ERROR
  metadata:
    vulnerability: Weak KDF Configuration (PBKDF2-SHA1)
    pqc_risk: High
    crypto_agility: 'No'
    algorithm_name: PBKDF2-SHA1
    algorithm_type: KDF
    cryptographic_function: Key Derivation
    library: PHP Core / OpenSSL
    purpose: Password/Key Derivation
    recommended_mitigation: Use Argon2id or scrypt; if PBKDF2 is required, use PBKDF2-HMAC-SHA256 with strong iteration count.
    cbom:
      cryptographic_function: Key Derivation
      algorithm_used: PBKDF2-SHA1
      algorithm_category: KDF
      library_module: PHP Core / OpenSSL
      key_length: variable
      purpose_usage: Password/Key Derivation
- id: pqc-php-legacy-mcrypt
  patterns:
  - pattern-either:
    - pattern: mcrypt_encrypt(...)
    - pattern: mcrypt_decrypt(...)
    - pattern: mcrypt_module_open(...)
    - pattern: mcrypt_generic(...)
  message: 'PQC CBOM Finding (Crypto-Agility=No): Deprecated mcrypt usage detected.'
  languages:
  - php
  severity: ERROR
  metadata:
    vulnerability: Legacy Mcrypt Library
    pqc_risk: High
    crypto_agility: 'No'
    algorithm_name: mcrypt
    algorithm_type: Encryption/Decryption
    cryptographic_function: Encryption/Decryption
    library: PHP mcrypt extension (deprecated)
    purpose: Encryption
    recommended_mitigation: Replace with libsodium or modern OpenSSL (AES-GCM/ChaCha20-Poly1305).
    cbom:
      cryptographic_function: Encryption/Decryption
      algorithm_used: mcrypt
      algorithm_category: Encryption/Decryption
      library_module: PHP mcrypt extension (deprecated)
      key_length: variable
      purpose_usage: Encryption
- id: pqc-php-openssl-weak-cipher
  patterns:
  - pattern-either:
    - pattern: openssl_encrypt(..., "des-cbc", ...)
    - pattern: openssl_encrypt(..., "des-ecb", ...)
    - pattern: openssl_encrypt(..., "des-ede3-cbc", ...)
    - pattern: openssl_encrypt(..., "rc2-cbc", ...)
    - pattern: openssl_encrypt(..., "rc4", ...)
    - pattern: openssl_encrypt(..., "bf-cbc", ...)
    - pattern: openssl_encrypt(..., "aes-128-ecb", ...)
    - pattern: openssl_encrypt(..., "aes-256-ecb", ...)
    - pattern: openssl_decrypt(..., "des-cbc", ...)
    - pattern: openssl_decrypt(..., "des-ecb", ...)
    - pattern: openssl_decrypt(..., "des-ede3-cbc", ...)
    - pattern: openssl_decrypt(..., "rc2-cbc", ...)
    - pattern: openssl_decrypt(..., "rc4", ...)
    - pattern: openssl_decrypt(..., "bf-cbc", ...)
    - pattern: openssl_decrypt(..., "aes-128-ecb", ...)
    - pattern: openssl_decrypt(..., "aes-256-ecb", ...)
  message: 'PQC CBOM Finding (Crypto-Agility=No): OpenSSL weak/unsafe cipher or mode detected (DES/3DES/RC2/RC4/Blowfish/ECB).
    Hardcoded cipher.'
  languages:
  - php
  severity: ERROR
  metadata:
    vulnerability: Hardcoded Weak Cipher (OpenSSL)
    pqc_risk: High
    crypto_agility: 'No'
    algorithm_name: DES/3DES/RC2/RC4/Blowfish/ECB
    algorithm_type: Encryption/Decryption
    cryptographic_function: Encryption/Decryption
    library: PHP OpenSSL
    purpose: Encryption/Decryption
    recommended_mitigation: 'Use AEAD: AES-GCM or ChaCha20-Poly1305. Avoid ECB and legacy ciphers.'
    cbom:
      cryptographic_function: Encryption/Decryption
      algorithm_used: DES/3DES/RC2/RC4/Blowfish/ECB
      algorithm_category: Encryption/Decryption
      library_module: PHP OpenSSL
      key_length: variable
      purpose_usage: Encryption/Decryption
- id: pqc-php-openssl-aes-cbc-non-aead
  patterns:
  - pattern-either:
    - pattern: openssl_encrypt(..., "aes-128-cbc", ...)
    - pattern: openssl_encrypt(..., "aes-192-cbc", ...)
    - pattern: openssl_encrypt(..., "aes-256-cbc", ...)
    - pattern: openssl_decrypt(..., "aes-128-cbc", ...)
    - pattern: openssl_decrypt(..., "aes-192-cbc", ...)
    - pattern: openssl_decrypt(..., "aes-256-cbc", ...)
  message: 'CBOM Finding (Crypto-Agility=Low): AES-CBC detected. CBC is not AEAD; ensure integrity (MAC/Encrypt-then-MAC)
    or migrate to AES-GCM/ChaCha20-Poly1305.'
  languages:
  - php
  severity: WARNING
  metadata:
    vulnerability: Non-AEAD Symmetric Mode (AES-CBC)
    pqc_risk: Medium
    crypto_agility: Low
    algorithm_name: AES-CBC
    algorithm_type: Encryption/Decryption
    cryptographic_function: Encryption/Decryption
    library: PHP OpenSSL
    purpose: Encryption/Decryption
    recommended_mitigation: Prefer AEAD (AES-GCM/ChaCha20-Poly1305). If CBC required, add strong integrity protection (HMAC)
      correctly.
    cbom:
      cryptographic_function: Encryption/Decryption
      algorithm_used: AES-CBC
      algorithm_category: Encryption/Decryption
      library_module: PHP OpenSSL
      key_length: variable
      purpose_usage: Encryption/Decryption
- id: pqc-php-crypt-blowfish
  patterns:
  - pattern-either:
    - pattern: crypt(...)
    - pattern: CRYPT_BLOWFISH
  message: 'PQC CBOM Finding (Crypto-Agility=Low): crypt()/CRYPT_BLOWFISH detected (bcrypt/Blowfish). Plan migration strategy.'
  languages:
  - php
  severity: WARNING
  metadata:
    vulnerability: Password Hashing (crypt()/Blowfish)
    pqc_risk: Medium
    crypto_agility: Low
    algorithm_name: bcrypt (Blowfish)
    algorithm_type: Hashing
    cryptographic_function: Password Hashing
    library: PHP Core
    purpose: Password Hashing
    recommended_mitigation: Prefer Argon2id via password_hash; implement rehash-on-login migration.
    cbom:
      cryptographic_function: Password Hashing
      algorithm_used: bcrypt (Blowfish)
      algorithm_category: Hashing
      library_module: PHP Core
      key_length: variable
      purpose_usage: Password Hashing
- id: pqc-php-password-hash-bcrypt
  patterns:
  - pattern: password_hash(..., PASSWORD_BCRYPT, ...)
  message: 'PQC CBOM Finding (Crypto-Agility=No): password_hash with PASSWORD_BCRYPT forces bcrypt (hardcoded).'
  languages:
  - php
  severity: ERROR
  metadata:
    vulnerability: Hardcoded Password Hashing (Bcrypt)
    pqc_risk: High
    crypto_agility: 'No'
    algorithm_name: Bcrypt (Blowfish)
    algorithm_type: Hashing
    cryptographic_function: Password Hashing
    library: PHP Core
    purpose: Password Hashing
    recommended_mitigation: Prefer PASSWORD_ARGON2ID when available + rehash strategy.
    cbom:
      cryptographic_function: Password Hashing
      algorithm_used: Bcrypt (Blowfish)
      algorithm_category: Hashing
      library_module: PHP Core
      key_length: variable
      purpose_usage: Password Hashing
- id: pqc-php-password-hash-default
  patterns:
  - pattern: password_hash(..., PASSWORD_DEFAULT, ...)
  message: 'PQC CBOM Finding (Crypto-Agility=Low): PASSWORD_DEFAULT is version-dependent; review migration readiness.'
  languages:
  - php
  severity: WARNING
  metadata:
    vulnerability: Implicit Hashing Algorithm (PASSWORD_DEFAULT)
    pqc_risk: Medium
    crypto_agility: Low
    algorithm_name: PASSWORD_DEFAULT (version-dependent)
    algorithm_type: Hashing
    cryptographic_function: Password Hashing
    library: PHP Core
    purpose: Password Hashing
    recommended_mitigation: Pin to Argon2id where available; ensure password_needs_rehash() is used.
    cbom:
      cryptographic_function: Password Hashing
      algorithm_used: PASSWORD_DEFAULT (version-dependent)
      algorithm_category: Hashing
      library_module: PHP Core
      key_length: variable
      purpose_usage: Password Hashing
- id: pqc-php-password-hash-argon2id
  patterns:
  - pattern-either:
    - pattern: password_hash(..., PASSWORD_ARGON2ID, ...)
    - pattern: PASSWORD_ARGON2ID
  message: 'CBOM Inventory (Good Practice): Argon2id password hashing detected.'
  languages:
  - php
  severity: INFO
  metadata:
    category: Inventory
    pqc_risk: Low
    crypto_agility: Medium
    algorithm_name: Argon2id
    algorithm_type: Hashing
    cryptographic_function: Password Hashing
    library: PHP Core
    purpose: Password Hashing
    cbom:
      cryptographic_function: Password Hashing
      algorithm_used: Argon2id
      algorithm_category: Hashing
      library_module: PHP Core
      key_length: variable
      purpose_usage: Password Hashing
- id: pqc-php-libsodium-inventory-aead
  patterns:
  - pattern-either:
    - pattern: sodium_crypto_aead_chacha20poly1305_ietf_encrypt(...)
    - pattern: sodium_crypto_aead_chacha20poly1305_ietf_decrypt(...)
