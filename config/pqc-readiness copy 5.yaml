- id: pqc-php-insecure-rng
  patterns:
  - pattern-either:
    - pattern: rand(...)
    - pattern: mt_rand(...)
    - pattern: uniqid(...)
  message: 'Security Finding: Insecure RNG primitive detected (rand/mt_rand/uniqid). If used for secrets/tokens/keys, it is
    not cryptographically secure.'
  languages:
  - php
  severity: WARNING
  metadata:
    vulnerability: Insecure RNG
    pqc_risk: Medium
    crypto_agility: 'No'
    algorithm_name: rand/mt_rand/uniqid
    algorithm_type: Randomness
    cryptographic_function: Random Number Generation
    library: PHP Core
    purpose: Token/ID generation
    recommended_mitigation: Use random_bytes() / random_int() for security-sensitive tokens.
    cbom:
      cryptographic_function: Random Number Generation
      algorithm_used: rand/mt_rand/uniqid
      algorithm_category: Randomness
      library_module: PHP Core
      key_length: variable
      purpose_usage: Token/ID generation
- id: pqc-php-good-rng-inventory
  patterns:
