    impact (asymmetric footprint).'
  languages:
  - php
  severity: INFO
  metadata:
    category: Inventory
    pqc_risk: Transition
    crypto_agility: Depends
    algorithm_name: Ed25519 / KX
    algorithm_type: Asymmetric Crypto / Key Exchange
    cryptographic_function: Sign/Verify / Key Agreement
    library: libsodium
    purpose: Sign/Verify / Key Exchange
    cbom:
